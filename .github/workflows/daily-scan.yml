# TradeAgent Daily Lead Scan
# Runs every day at 5:00 AM Beijing time (21:00 UTC previous day)
# Searches for textile buyers and emails you a report
# Works even when your computer is off!

name: Daily Lead Scan

on:
  schedule:
    # Every day at 21:00 UTC = 05:00 Beijing time (next day)
    - cron: '0 21 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ddgs requests beautifulsoup4 lxml openai

      - name: Run daily scan
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.xiaomimimo.com/v1' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'mimo-v2.5' }}
          SCAN_KEYWORDS: ${{ secrets.SCAN_KEYWORDS || 'embroidery thread, gold metallic yarn' }}
          SCAN_COUNTRIES: ${{ secrets.SCAN_COUNTRIES || 'Germany, United States, United Kingdom, France, Italy, Spain, Australia, India' }}
        run: |
          python scripts/daily_scan.py

      - name: Upload leads JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-leads-${{ github.run_id }}
          path: |
            scripts/daily_leads.json
            scripts/scanned_domains.json
          if-no-files-found: ignore

      - name: Commit scan results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/daily_leads.json scripts/scanned_domains.json
          git diff --staged --quiet || git commit -m "chore: update daily scan results [skip ci]"
          git push
