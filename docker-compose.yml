version: "3.8"

services:
  backend:
    build: ./backend
    container_name: tradeagent-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - db-data:/app/tradeagent.db
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tradeagent-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data: